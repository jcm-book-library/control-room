name: Collect repo data and publish

on:
  schedule:
    - cron: '17 19 * * *'   # about 6:17am Melbourne
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # only to replace the one-commit `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect repo data
        run: python3 tools/collect.py site/data/repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the health report (shown on the dashboard)
        run: python3 tools/health.py site/data/repos.json site/data/health-latest.md
      - name: Save a copy of the data and the health report on the data branch (sessions read them with git)
        run: |
          set -e
          D=$(mktemp -d)
          cp site/data/repos.json site/data/health-latest.md "$D/"
          cd "$D"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json health-latest.md
          git commit -q -m "Repo data $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy in its own job: deploying in the same job as the upload sometimes
  # ran before GitHub had registered the upload ("No artifacts named github-pages").
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
