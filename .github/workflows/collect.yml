name: Collect repo data and publish

on:
  schedule:
    - cron: '17 19 * * *'   # about 6:17am Melbourne
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # only to replace the one-commit `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect repo data
        run: python3 tools/collect.py site/data/repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save a copy of the data on the data branch (the weekly health check reads it with git)
        run: |
          set -e
          D=$(mktemp -d)
          cp site/data/repos.json "$D/repos.json"
          cd "$D"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git commit -q -m "Repo data $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Include the latest health check, if there is one
        run: |
          if [ -f reports/health-latest.md ]; then
            cp reports/health-latest.md site/data/health-latest.md
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
